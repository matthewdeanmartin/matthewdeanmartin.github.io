<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>

  <!-- Primary fallback: meta refresh -->
  <meta http-equiv="refresh" content="5;url=https://matthewdeanmartin.github.io/matthewdeanmartin/" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />

  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d10;
      color: #e6e8eb;
    }
    main {
      max-width: 520px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.9;
    }
    a {
      color: #6bbcff;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
    .small {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>

  <script>
    (function () {
      const target = "https://matthewdeanmartin.github.io/matthewdeanmartin/";

      try {
        // Fast path: JS redirect
        window.location.replace(target);
      } catch (_) {
        // If JS is partially blocked, meta refresh + manual link remain
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>Redirecting…</h1>
    <p>
      You are being sent to the destination page.
      If nothing happens automatically, use the link below.
    </p>
    <p>
      <a href="https://matthewdeanmartin.github.io/matthewdeanmartin/">
        Continue to destination →
      </a>
    </p>
    <p class="small">
      JavaScript disabled or blocked? The page will refresh in ~5 seconds.
    </p>
  </main>
</body>
</html>
